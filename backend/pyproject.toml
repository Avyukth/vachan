[project]
name = "vachan-backend"
version = "0.1.0"
description = "Policy-first voice collections backend for the Vachan demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "sarvamai>=0.1.28",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
